<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QuizRoulette — Pilotage du backlog</title>
<style>
  :root {
    --bg:#11131a; --card:#1b1e28; --line:#2b3040; --ink:#e8ebf5; --dim:#98a0b8;
    --acc:#7aa2ff; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --mv:#FF9BEE;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
         padding: env(safe-area-inset-top,0) 16px calc(24px + env(safe-area-inset-bottom,0)); }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:16px 0 10px; }
  h1 { font-size:1.15rem; margin:0; flex:1 1 auto; }
  .muted { color:var(--dim); font-size:.85rem; }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line);
           background:#232839; color:var(--ink); padding:8px 12px; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#0c1020; font-weight:600; }
  button.ghost { background:transparent; }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; width:100%; background:#141823; color:var(--ink);
           border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  textarea { min-height:70px; resize:vertical; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .filters input { flex:2 1 180px; } .filters select { flex:1 1 130px; width:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .head { display:flex; gap:10px; align-items:center; padding:12px 14px; cursor:pointer; }
  .id { font-weight:700; color:var(--acc); flex:0 0 auto; }
  .name { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip { font-size:.72rem; padding:2px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  .s-Todo{color:var(--dim)} .s-Inprogress{color:var(--warn)} .s-Done{color:var(--ok)} .s-Blocked{color:var(--bad)}
  .p-High{color:var(--bad)} .p-Med{color:var(--warn)} .p-Low{color:var(--dim)}
  .body { padding:0 14px 14px; display:grid; gap:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  label { display:grid; gap:4px; font-size:.78rem; color:var(--dim); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .pipe { display:grid; gap:6px; background:#151925; border:1px solid var(--line); border-radius:12px; padding:10px; }
  .step { display:flex; gap:8px; align-items:center; font-size:.85rem; }
  .step .dot { width:18px; text-align:center; flex:0 0 18px; }
  .step.done .dot{color:var(--ok)} .step.busy .dot{color:var(--warn)} .step.fail .dot{color:var(--bad)}
  .step.todo { color:var(--dim); }
  a { color:var(--acc); }
  .note { font-size:.8rem; color:var(--dim); }
  .err { color:var(--bad); font-size:.85rem; }
  .gate { max-width:360px; margin:12vh auto; display:grid; gap:10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <h1>Pilotage du backlog</h1>
  <p class="muted">Mot de passe (variable <code>BACKLOG_KEY</code> sur Vercel).</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="Mot de passe">
  <button class="primary" id="enter">Entrer</button>
  <p class="err" id="gateErr"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Backlog QuizRoulette</h1>
    <span class="muted" id="stamp"></span>
    <button class="ghost" id="refresh">↻</button>
  </header>

  <div class="filters">
    <input id="q" placeholder="Rechercher…">
    <select id="fStatus">
      <option value="">Tous les états</option>
      <option>Todo</option><option>In progress</option><option>Blocked</option><option>Done</option>
    </select>
    <select id="fPrio">
      <option value="">Toutes priorités</option>
      <option>High</option><option>Med</option><option>Low</option>
    </select>
    <select id="fBacklog">
      <option value="">Les deux</option>
      <option value="functional">Fonctionnel</option>
      <option value="technical">Technique</option>
    </select>
  </div>

  <div id="list"></div>
  <p class="err" id="err"></p>
</div>

<script type="module">
const $ = s => document.querySelector(s);
let KEY = localStorage.getItem('backlogKey') || '';
let stories = [], pipeline = {}, open = new Set();

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-backlog-key': KEY, ...(opts.headers || {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Erreur ${r.status}`);
  return data;
}

// ── gate ──────────────────────────────────────────────────────────────
async function start() {
  if (!KEY) return showGate();
  try { await load(); $('#app').hidden = false; }
  catch (e) { showGate(e.message); }
}
function showGate(msg) {
  $('#gate').hidden = false; $('#app').hidden = true;
  if (msg) $('#gateErr').textContent = msg;
}
$('#enter').addEventListener('click', async () => {
  KEY = $('#key').value.trim();
  try {
    await load();
    localStorage.setItem('backlogKey', KEY);
    $('#gate').hidden = true; $('#app').hidden = false;
  } catch (e) { $('#gateErr').textContent = e.message; }
});
$('#key').addEventListener('keydown', e => { if (e.key === 'Enter') $('#enter').click(); });

// ── data ──────────────────────────────────────────────────────────────
async function load() {
  const [b, p] = await Promise.all([api('/api/backlog'), api('/api/pipeline').catch(() => ({ byStory: {} }))]);
  stories = b.stories; pipeline = p.byStory || {};
  $('#stamp').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  render();
}
$('#refresh').addEventListener('click', () => load().catch(e => $('#err').textContent = e.message));
['#q', '#fStatus', '#fPrio', '#fBacklog'].forEach(s => $(s).addEventListener('input', render));

// ── pipeline checklist ────────────────────────────────────────────────
// Story → Issue → Claude → PR → Preview → Merged, newest attempt first.
function pipeHTML(id) {
  const runs = (pipeline[id] || []).slice().sort((a, b) => b.issue.number - a.issue.number);
  if (!runs.length) return `<div class="pipe"><div class="step done"><span class="dot">✓</span>Story dans le backlog</div>
    <div class="step todo"><span class="dot">○</span>Issue — pas encore créée</div></div>`;
  return runs.map(r => {
    const run = r.run, pr = r.pr;
    const runState = !run ? ['todo', '○', 'Claude — pas lancé']
      : run.status !== 'completed' ? ['busy', '◐', `Claude travaille… (<a href="${run.url}" target="_blank">journal</a>)`]
      : run.conclusion === 'success' ? ['done', '✓', `Claude a fini (<a href="${run.url}" target="_blank">journal</a>)`]
      : ['fail', '✗', `Claude a échoué (<a href="${run.url}" target="_blank">journal</a>)`];
    const prState = !pr ? ['todo', '○', r.branch ? 'Branche poussée, PR à ouvrir' : 'PR — pas encore']
      : pr.merged ? ['done', '✓', `PR #${pr.number} fusionnée (<a href="${pr.url}" target="_blank">voir</a>)`]
      : ['busy', '◐', `PR #${pr.number} ouverte (<a href="${pr.url}" target="_blank">voir</a>)`];
    const prev = r.preview ? ['done', '✓', `<a href="${r.preview}" target="_blank">Tester l'aperçu</a>`]
      : ['todo', '○', 'Aperçu Vercel'];
    const steps = [
      ['done', '✓', `Issue #${r.issue.number} — <a href="${r.issue.url}" target="_blank">${r.issue.title}</a>`],
      runState, prState, prev,
      pr && pr.merged ? ['done', '✓', 'Fusionné dans main'] : ['todo', '○', 'Fusion'],
    ];
    return `<div class="pipe">${steps.map(([c, d, t]) =>
      `<div class="step ${c}"><span class="dot">${d}</span><span>${t}</span></div>`).join('')}</div>`;
  }).join('');
}

function latestIssue(id) {
  const runs = (pipeline[id] || []).slice().sort((a, b) => b.issue.number - a.issue.number);
  return runs[0] ? runs[0].issue.number : null;
}

// ── render ────────────────────────────────────────────────────────────
function render() {
  const q = $('#q').value.toLowerCase(), fs = $('#fStatus').value, fp = $('#fPrio').value, fb = $('#fBacklog').value;
  const rows = stories.filter(s =>
    (!fs || s.status === fs) && (!fp || s.priority === fp) && (!fb || s.backlog === fb) &&
    (!q || (s.id + ' ' + s.item).toLowerCase().includes(q)));

  $('#list').innerHTML = rows.map(s => {
    const isOpen = open.has(s.id);
    const issueNo = latestIssue(s.id);
    return `<div class="card" data-id="${s.id}">
      <div class="head" data-toggle="${s.id}">
        <span class="id">${s.id}</span>
        <span class="name">${esc(s.title)}</span>
        ${s.priority && s.priority !== '—' ? `<span class="chip p-${s.priority.replace(/\s/g, '')}">${s.priority}</span>` : ''}
        <span class="chip s-${(s.status || '').replace(/\s/g, '')}">${s.status}</span>
      </div>
      ${isOpen ? `<div class="body">
        <label>Description (markdown)
          <textarea data-f="item">${esc(s.item)}</textarea></label>
        <div class="grid">
          <label>Taille ${sel('size', ['—', 'S', 'M', 'L', 'XL'], s.size)}</label>
          <label>Priorité ${sel('priority', ['—', 'High', 'Med', 'Low'], s.priority)}</label>
          <label>État ${sel('status', ['Todo', 'In progress', 'Blocked', 'Done', '—'], s.status)}</label>
          <label>Dépend de <input data-f="depends" value="${esc(s.depends)}"></label>
        </div>
        <div class="row">
          <button class="primary" data-act="save">Enregistrer</button>
          <span class="note" data-out="save"></span>
        </div>

        <div class="pipe-wrap">${pipeHTML(s.id)}</div>

        ${issueNo ? '' : `<label>Brief pour Claude (décisions déjà prises…)
          <textarea data-f="brief" placeholder="Décisions : …"></textarea></label>`}
        <div class="row">
          ${issueNo
            ? `<button data-act="trigger">Relancer Claude sur #${issueNo}</button>`
            : `<button data-act="issue">Créer l'issue</button>
               <button class="primary" data-act="issue-run">Créer + lancer Claude</button>`}
          <span class="note" data-out="act"></span>
        </div>

        <label>Affinage après test (envoyé à Claude)
          <textarea data-f="refine" placeholder="Ce qui ne va pas / à ajuster après avoir testé l'aperçu…"></textarea></label>
        <div class="row">
          <button data-act="refine">Envoyer l'affinage</button>
          <span class="note" data-out="refine"></span>
        </div>
      </div>` : ''}
    </div>`;
  }).join('') || '<p class="muted">Aucune story.</p>';
}

const sel = (f, opts, val) => `<select data-f="${f}">${opts.map(o =>
  `<option${o === val ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── interactions ──────────────────────────────────────────────────────
$('#list').addEventListener('click', async e => {
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    const id = toggle.dataset.toggle;
    open.has(id) ? open.delete(id) : open.add(id);
    return render();
  }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.card'), id = card.dataset.id;
  const story = stories.find(s => s.id === id);
  const field = f => card.querySelector(`[data-f="${f}"]`);
  const out = n => card.querySelector(`[data-out="${n}"]`);
  const act = btn.dataset.act;
  btn.disabled = true;

  try {
    if (act === 'save') {
      out('save').textContent = 'Enregistrement…';
      const body = { backlog: story.backlog, id, item: field('item').value.trim(),
        size: field('size').value, priority: field('priority').value,
        status: field('status').value, depends: field('depends').value.trim() };
      const r = await api('/api/backlog', { method: 'POST', body: JSON.stringify(body) });
      Object.assign(story, r.story, { title: r.story.item.match(/\*\*(.+?)\*\*/)?.[1] || story.title });
      out('save').textContent = 'Enregistré ✓ (commit sur main)';
    }

    if (act === 'issue' || act === 'issue-run') {
      out('act').textContent = 'Création de l\'issue…';
      const r = await api('/api/action', { method: 'POST', body: JSON.stringify({
        kind: 'issue', backlog: story.backlog, id, title: story.title,
        brief: field('brief') ? field('brief').value : '', trigger: act === 'issue-run' }) });
      out('act').innerHTML = `Issue <a href="${r.issue.url}" target="_blank">#${r.issue.number}</a> créée${act === 'issue-run' ? ' — Claude démarre' : ''}`;
      setTimeout(() => load(), 4000);
    }

    if (act === 'trigger') {
      out('act').textContent = 'Lancement…';
      await api('/api/action', { method: 'POST', body: JSON.stringify({ kind: 'trigger', issueNumber: latestIssue(id) }) });
      out('act').textContent = 'Claude relancé ✓';
      setTimeout(() => load(), 5000);
    }

    if (act === 'refine') {
      const text = field('refine').value.trim();
      if (!text) throw new Error('Écris d\'abord ce qu\'il faut ajuster.');
      out('refine').textContent = 'Envoi…';
      const r = await api('/api/action', { method: 'POST', body: JSON.stringify({
        kind: 'refine', storyId: id, issueNumber: latestIssue(id), text }) });
      const where = { pr: 'sur la PR', issue: 'sur l\'issue', 'new-issue': 'dans une nouvelle issue' }[r.target];
      out('refine').innerHTML = `Envoyé ${where} <a href="${r.url}" target="_blank">#${r.number}</a>`;
      field('refine').value = '';
      setTimeout(() => load(), 5000);
    }
  } catch (err) {
    (out('act') || out('save')).textContent = '';
    $('#err').textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

// Keep the pipeline fresh while a run is in flight.
setInterval(() => {
  if (!$('#app').hidden && document.visibilityState === 'visible') load().catch(() => {});
}, 30000);

start();
</script>
</body>
</html>
