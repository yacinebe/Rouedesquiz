<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roue des Quiz 🎡</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- ══════════════ PROFILE SCREEN ══════════════ -->
<div id="profileScreen" class="screen active">
  <div class="profile-title">🎈 Qui joue ? 🎈</div>
  <div class="profile-list" id="profileList">
    <div class="profile-loading">Chargement…</div>
  </div>
  <div class="profile-hint" id="profileHint"></div>
  <div class="profile-footer">
    <button class="manage-btn" id="manageBtn" aria-pressed="false" style="display:none">🗑️ Gérer les profils</button>
    <button class="manage-btn" id="guestBtn">🎮 Sans profil</button>
  </div>
</div>

<!-- ══════════════ PROFILE CREATE SCREEN ══════════════ -->
<div id="profileCreateScreen" class="screen">
  <div class="profile-title">Nouveau joueur 🎉</div>
  <form class="profile-form" id="profileForm">
    <label>Prénom
      <input id="pfFirst" type="text" autocomplete="off" maxlength="24" required>
    </label>
    <label>Nom
      <input id="pfLast" type="text" autocomplete="off" maxlength="24">
    </label>
    <label>Date de naissance
      <input id="pfDob" type="date">
    </label>
    <span class="avatar-pick-label">Choisis ton personnage</span>
    <div class="avatar-pick" id="avatarPick"></div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Créer 🚀</button>
      <button type="button" class="btn-secondary" id="pfCancel">Annuler</button>
    </div>
  </form>
</div>

<!-- ══════════════ WHEEL SCREEN ══════════════ -->
<div id="wheelScreen" class="screen">
  <h1>🎡 La Roue des Quiz !</h1>

  <div class="wheel-section">
    <div class="pointer"></div>
    <div class="wheel-wrap">
      <canvas id="wheel" width="380" height="380"></canvas>
      <button class="spin-btn" id="spinBtn">TOURNE !<br>🎲</button>
    </div>
  </div>

  <div class="result-banner" id="resultArea"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FF6B6B"></div>Maths</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ECDC4"></div>Lecture</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FFE66D"></div>Géographie</div>
    <div class="legend-item"><div class="legend-dot" style="background:#60AFFF"></div>Astronomie</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6BCB77"></div>Animaux</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F59E0B"></div>Arabe</div>
    <div class="legend-item"><div class="legend-dot" style="background:#C084FC"></div>⭐ Surprise !</div>
  </div>
  <button class="btn-secondary" id="progressBtn">📊 Mes progrès</button>
</div>

<!-- ══════════════ QUIZ SCREEN ══════════════ -->
<div id="quizScreen" class="screen">
  <div class="quiz-header">
    <button class="back-btn" data-action="wheel">← Roue</button>
    <div class="quiz-cat-badge" id="catBadge"></div>
  </div>

  <div class="progress-dots" id="progressDots"></div>

  <div class="question-card" id="questionCard">
    <div class="question-image-wrap" id="questionImageWrap" style="display:none;"></div>
    <div class="question-num" id="questionNum"></div>
    <div class="question-text" id="questionText"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn"></button>
  </div>
</div>

<!-- ══════════════ MILESTONE SCREEN (every 10 questions) ══════════════ -->
<div id="milestoneScreen" class="screen">
  <div class="score-emoji" id="msEmoji"></div>
  <div class="score-title" id="msTitle"></div>
  <div class="score-num" id="msNum"></div>
  <div class="score-sub" id="msSub"></div>
  <div class="score-actions">
    <button class="btn-primary" id="msContinue">Continuer 🔥</button>
    <button class="btn-secondary" data-action="wheel">🎡 Retour à la roue</button>
  </div>
</div>

<!-- ══════════════ PROGRESS SCREEN ══════════════ -->
<div id="progressScreen" class="screen">
  <div class="quiz-header">
    <button class="back-btn" data-action="wheel">← Roue</button>
    <div class="quiz-cat-badge" style="color:#FFE66D;border-color:#FFE66D">📊 Mes progrès</div>
  </div>
  <div class="progress-body" id="progressBody"></div>
</div>

<!-- Current player badge — shown top-right during play; click to switch -->
<div id="currentPlayer" class="current-player" style="display:none">
  <span class="cp-avatar"></span>
  <span class="cp-text">
    <span class="cp-name"></span>
    <span class="cp-score"></span>
  </span>
  <span class="cp-switch">changer</span>
</div>

<script src="questions.js"></script>
<script type="module" src="assets/js/main.js"></script>
<script>
  // If the ES modules can't load (e.g. opened via file://), guide the user.
  setTimeout(function () {
    if (!window.__qrReady) {
      var list = document.getElementById('profileList');
      if (list) list.innerHTML = '<div class="profile-hint">Ouvre le jeu via un serveur web (http), pas en double-cliquant le fichier.</div>';
    }
  }, 1500);
</script>
</body>
</html>
