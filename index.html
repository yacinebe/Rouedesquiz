<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roue des Quiz 🎡</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --math:     #FF6B6B;
    --reading:  #4ECDC4;
    --geo:      #FFE66D;
    --surprise: #C084FC;
    --astro:    #60AFFF;
    --animaux:  #6BCB77;
    --arabe:    #F59E0B;
    --bg:       #1a1a2e;
    --card:     #16213e;
    --text:     #f0f0f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 50%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 15%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 90%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 75%, rgba(255,255,255,.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    position: relative;
    z-index: 1;
    min-height: 100vh;
  }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ── PROFILE SCREEN ── */
  #profileScreen { gap: 22px; padding: 24px; text-align: center; }
  .profile-title { font-family: 'Fredoka One', cursive; font-size: 1.9rem; }
  .profile-list { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 520px; }
  .profile-btn {
    padding: 16px 22px; border-radius: 22px;
    border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08);
    color: #fff; font-family: 'Fredoka One', cursive; font-size: 1.05rem; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 108px;
    transition: transform .15s, background .2s;
  }
  .profile-btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.16); }
  .profile-btn .avatar { font-size: 2.1rem; line-height: 1; }
  .profile-btn.add { border-style: dashed; background: transparent; }
  .profile-btn { position: relative; }
  .profile-name { font-size: 1.05rem; }
  .profile-age { font-size: .78rem; opacity: .6; font-family: 'Nunito', sans-serif; }
  .profile-hint { opacity: .6; font-size: .95rem; }
  .profile-del {
    position: absolute; top: -9px; right: -9px; width: 26px; height: 26px; border-radius: 50%;
    background: #FF6B6B; color: #fff; font-size: .85rem; display: none;
    align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  #profileScreen.managing .profile-del { display: flex; }
  #profileScreen.managing .profile-btn.add { opacity: .35; pointer-events: none; }
  .manage-btn {
    margin-top: 4px; padding: 8px 18px; border-radius: 100px; border: 2px solid rgba(255,255,255,0.22);
    background: transparent; color: #fff; font-family: 'Nunito', sans-serif; font-size: .9rem; cursor: pointer; opacity: .82;
  }
  .manage-btn[aria-pressed="true"] { background: rgba(255,255,255,0.16); opacity: 1; }
  .profile-loading { opacity: .5; font-family: 'Nunito', sans-serif; font-size: .95rem; padding: 18px; }
  .profile-footer { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  /* ── PROFILE CREATE FORM ── */
  #profileCreateScreen { gap: 16px; padding: 24px; }
  .profile-form {
    display: flex; flex-direction: column; gap: 14px; width: min(420px, 92vw);
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px; padding: 22px;
  }
  .profile-form label { display: flex; flex-direction: column; gap: 6px; font-family: 'Nunito', sans-serif; font-size: .9rem; opacity: .85; text-align: left; }
  .profile-form input {
    font-family: 'Nunito', sans-serif; font-size: 1rem; padding: 11px 14px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.22); color: #fff;
  }
  .profile-form input:focus { outline: none; border-color: #FFE66D; }
  .avatar-pick-label { font-family: 'Nunito', sans-serif; font-size: .9rem; opacity: .85; }
  .avatar-pick { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .avatar-opt {
    font-size: 2rem; width: 58px; height: 58px; border-radius: 16px; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center; transition: transform .15s, border-color .15s;
  }
  .avatar-opt:hover { transform: scale(1.08); }
  .avatar-opt.sel { border-color: #FFE66D; background: rgba(255,230,109,0.18); transform: scale(1.08); }
  .form-actions { display: flex; gap: 12px; justify-content: center; margin-top: 4px; }

  /* ── CURRENT PLAYER BADGE (top-right during play) ── */
  .current-player {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 6px 13px 6px 9px; border-radius: 100px;
    background: rgba(0,0,0,0.34); border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(6px); color: #fff; font-family: 'Fredoka One', cursive; font-size: .92rem;
  }
  .current-player .cp-avatar { font-size: 1.4rem; line-height: 1; }
  .current-player .cp-text { display: flex; flex-direction: column; line-height: 1.15; }
  .current-player .cp-score { font-size: .72rem; opacity: .85; font-family: 'Nunito', sans-serif; }
  .current-player .cp-switch { font-size: .68rem; opacity: .6; font-family: 'Nunito', sans-serif; }

  /* ── PROGRESS PAGE ── */
  #progressScreen { justify-content: flex-start; padding: 18px 16px 60px; gap: 14px; }
  .progress-body { width: min(560px, 94vw); display: flex; flex-direction: column; gap: 12px; }
  .prog-card { background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 14px 16px; text-align: left; }
  .prog-head { display: flex; align-items: center; gap: 10px; font-family: 'Fredoka One', cursive; font-size: 1.1rem; }
  .prog-emoji { font-size: 1.5rem; }
  .prog-stats { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 10px; font-family: 'Nunito', sans-serif; font-size: .92rem; opacity: .85; }
  .prog-stats b { font-family: 'Fredoka One', cursive; opacity: 1; }
  .prog-replay { padding: 9px 18px; font-size: .95rem; }
  .prog-done { font-family: 'Nunito', sans-serif; font-size: .88rem; opacity: .6; }

  /* ── WHEEL SCREEN ── */
  #wheelScreen { gap: 22px; padding: 24px; }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 5vw, 3rem);
    text-align: center;
    background: linear-gradient(135deg, #FF6B6B, #C084FC, #60AFFF, #4ECDC4, #FFE66D);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(192,132,252,0.4));
  }

  .wheel-section { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .pointer {
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 36px solid #fff;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    position: relative;
  }
  .pointer::after {
    content: '';
    position: absolute;
    top: -40px; left: -8px;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
  }

  .wheel-wrap {
    position: relative;
    width: min(360px, 88vw);
    height: min(360px, 88vw);
  }

  canvas {
    border-radius: 50%;
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.15),
      0 0 0 12px rgba(255,255,255,0.06),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(96,175,255,0.2);
    cursor: pointer;
    width: 100%; height: 100%;
  }

  .spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 70px; height: 70px;
    border-radius: 50%;
    background: #fff;
    border: none;
    font-family: 'Fredoka One', cursive;
    font-size: 0.78rem;
    color: #1a1a2e;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    z-index: 5;
    line-height: 1.2;
    text-align: center;
    padding: 4px;
  }
  .spin-btn:hover { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 6px 28px rgba(0,0,0,0.6); }
  .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: translate(-50%, -50%); }

  /* Result banner on wheel screen */
  .result-banner {
    min-height: 72px;
    display: flex; align-items: center; justify-content: center;
  }
  .result-card {
    background: var(--card);
    border-radius: 18px;
    padding: 14px 28px;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.2rem, 4vw, 1.7rem);
    border: 2px solid transparent;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    display: flex; align-items: center; gap: 12px;
    flex-direction: column;
  }
  .result-card .rc-top { display: flex; align-items: center; gap: 12px; }
  .result-card .start-quiz-btn {
    margin-top: 6px;
    background: #fff;
    color: #1a1a2e;
    border: none;
    border-radius: 100px;
    padding: 8px 22px;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .start-quiz-btn:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .result-card.math       { border-color: var(--math);    color: var(--math);    box-shadow: 0 0 30px rgba(255,107,107,.3); }
  .result-card.lecture    { border-color: var(--reading); color: var(--reading); box-shadow: 0 0 30px rgba(78,205,196,.3); }
  .result-card.geographie { border-color: var(--geo);     color: var(--geo);     box-shadow: 0 0 30px rgba(255,230,109,.3); }
  .result-card.surprise   { border-color: var(--surprise);color: var(--surprise);box-shadow: 0 0 30px rgba(192,132,252,.3); }
  .result-card.astronomie { border-color: var(--astro);   color: var(--astro);   box-shadow: 0 0 30px rgba(96,175,255,.3); }
  .result-card.animaux    { border-color: var(--animaux); color: var(--animaux); box-shadow: 0 0 30px rgba(107,203,119,.3); }
  .result-card.arabe      { border-color: var(--arabe);   color: var(--arabe);   box-shadow: 0 0 30px rgba(245,158,11,.3); }

  .result-emoji { font-size: 1.8rem; }

  .legend {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 440px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    background: var(--card);
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 0.78rem; font-weight: 700;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Confetti */
  .confetti-piece {
    position: fixed; width: 10px; height: 10px; border-radius: 2px;
    top: -20px; animation: fall linear forwards; z-index: 999; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

  /* ── QUIZ SCREEN ── */
  #quizScreen {
    padding: 24px;
    gap: 0;
    justify-content: flex-start;
  }

  .quiz-header {
    width: 100%;
    max-width: 620px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    margin-top: 16px;
  }

  .back-btn {
    background: var(--card);
    border: 2px solid rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 50px;
    padding: 8px 18px;
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.2s, transform 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.12); transform: scale(1.04); }

  .quiz-cat-badge {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    padding: 8px 20px;
    border-radius: 50px;
    border: 2px solid currentColor;
    display: flex; align-items: center; gap: 8px;
  }

  /* Progress dots */
  .progress-dots {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.3s;
  }
  .dot.done  { background: #4ade80; }
  .dot.wrong { background: #f87171; }
  .dot.current { background: #fff; }

  /* Question card */
  .question-card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 620px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .question-num {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.5;
    margin-bottom: 10px;
  }

  .question-text {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    line-height: 1.3;
    margin-bottom: 24px;
  }

  .choices {
    display: flex; flex-direction: column; gap: 12px;
  }

  .choice-btn {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 14px;
    padding: 14px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: background 0.18s, border-color 0.18s, transform 0.12s;
    display: flex; align-items: center; gap: 12px;
  }
  .choice-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.14);
    transform: translateX(4px);
  }
  .choice-btn:disabled { cursor: not-allowed; }
  .choice-btn.correct {
    background: rgba(74, 222, 128, 0.2);
    border-color: #4ade80;
    color: #4ade80;
  }
  .choice-btn.wrong {
    background: rgba(248, 113, 113, 0.2);
    border-color: #f87171;
    color: #f87171;
  }
  .choice-letter {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  /* Question image (illustration or image-as-question) */
  .question-image-wrap {
    margin: 0 auto 18px;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
  }
  .question-image-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Image-options grid (2×2) */
  .choices.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .choice-btn.img {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    padding: 8px;
    gap: 0;
  }
  .choice-btn.img:hover:not(:disabled) {
    background: rgba(255,255,255,0.14);
    transform: translateY(-2px);
  }
  .choice-btn.img .img-wrap {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .choice-btn.img .img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .choice-btn.img .cap {
    font-size: 0.95rem;
    font-weight: 700;
    padding-bottom: 6px;
  }

  /* Feedback bar */
  .feedback {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1rem;
    display: none;
    align-items: center;
    gap: 10px;
  }
  .feedback.show { display: flex; }
  .feedback.correct { background: rgba(74,222,128,0.15); color: #4ade80; }
  .feedback.wrong   { background: rgba(248,113,113,0.15); color: #f87171; }

  /* Next / finish button */
  .next-btn {
    margin-top: 16px;
    display: none;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    cursor: pointer;
    background: #fff;
    color: #1a1a2e;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .next-btn.show { display: block; }
  .next-btn:hover { transform: scale(1.03); box-shadow: 0 6px 24px rgba(0,0,0,0.4); }

  /* ── SCORE SCREEN ── */
  #milestoneScreen { gap: 24px; padding: 24px; text-align: center; }

  .score-emoji { font-size: 5rem; animation: bounce 0.6s ease both; }
  @keyframes bounce {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .score-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
  }

  .score-num {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.5rem, 8vw, 4rem);
  }

  .score-sub { opacity: 0.6; font-size: 1rem; }

  .score-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

  .btn-primary {
    padding: 14px 32px;
    border-radius: 100px;
    border: none;
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    cursor: pointer;
    background: #fff;
    color: #1a1a2e;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-primary:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(0,0,0,0.4); }

  .btn-secondary {
    padding: 14px 32px;
    border-radius: 100px;
    border: 2px solid rgba(255,255,255,0.25);
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    cursor: pointer;
    background: transparent;
    color: #fff;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
</style>
</head>
<body>

<!-- ══════════════ PROFILE SCREEN ══════════════ -->
<div id="profileScreen" class="screen active">
  <div class="profile-title">🎈 Qui joue ? 🎈</div>
  <div class="profile-list" id="profileList">
    <div class="profile-loading">Chargement…</div>
  </div>
  <div class="profile-hint" id="profileHint"></div>
  <div class="profile-footer">
    <button class="manage-btn" id="manageBtn" aria-pressed="false" style="display:none">🗑️ Gérer les profils</button>
    <button class="manage-btn" id="guestBtn" onclick="playGuest()">🎮 Sans profil</button>
  </div>
</div>

<!-- ══════════════ PROFILE CREATE SCREEN ══════════════ -->
<div id="profileCreateScreen" class="screen">
  <div class="profile-title">Nouveau joueur 🎉</div>
  <form class="profile-form" id="profileForm">
    <label>Prénom
      <input id="pfFirst" type="text" autocomplete="off" maxlength="24" required>
    </label>
    <label>Nom
      <input id="pfLast" type="text" autocomplete="off" maxlength="24">
    </label>
    <label>Date de naissance
      <input id="pfDob" type="date">
    </label>
    <span class="avatar-pick-label">Choisis ton personnage</span>
    <div class="avatar-pick" id="avatarPick"></div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Créer 🚀</button>
      <button type="button" class="btn-secondary" id="pfCancel">Annuler</button>
    </div>
  </form>
</div>

<!-- ══════════════ WHEEL SCREEN ══════════════ -->
<div id="wheelScreen" class="screen">

<script src="questions.js"></script>
<script>
/* ═══════════════════════════════════════════════
   WHEEL
═══════════════════════════════════════════════ */
const segments = [
  { label: 'Maths',      emoji: '➕', color: '#FF6B6B', dark: '#c0392b', cls: 'math' },
  { label: 'Lecture',    emoji: '📖', color: '#4ECDC4', dark: '#16a085', cls: 'lecture' },
  { label: 'Géographie', emoji: '🌍', color: '#FFE66D', dark: '#b7950b', cls: 'geographie' },
  { label: 'Astronomie', emoji: '🔭', color: '#60AFFF', dark: '#1a5f8a', cls: 'astronomie' },
  { label: 'Animaux',    emoji: '🐾', color: '#6BCB77', dark: '#15803d', cls: 'animaux' },
  { label: 'Arabe',      emoji: '🔤', color: '#F59E0B', dark: '#92400e', cls: 'arabe' },
  { label: 'Surprise !', emoji: '⭐', color: '#C084FC', dark: '#7d3c98', cls: 'surprise' },
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const N = segments.length;
const ARC = (2 * Math.PI) / N;
const SIZE = 380;
const CX = SIZE / 2, CY = SIZE / 2, R = SIZE / 2 - 4;

let currentAngle = 0;
let spinning = false;
let currentSeg = null;

function drawWheel(angle) {
  ctx.clearRect(0, 0, SIZE, SIZE);
  for (let i = 0; i < N; i++) {
    const start = angle + i * ARC;
    const end   = start + ARC;
    const seg   = segments[i];

    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(start + ARC / 2);
    ctx.textAlign = 'right';

    ctx.font = `${SIZE * 0.056}px serif`;
    ctx.fillText(seg.emoji, R - 10, 6);

    ctx.font = `bold ${SIZE * 0.038}px 'Nunito', sans-serif`;
    ctx.fillStyle = seg.dark;
    ctx.fillText(seg.label, R - 42, 6);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(CX, CY, 34, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function getWinner(angle) {
  const normalized = (((-angle - Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  return segments[Math.floor(normalized / ARC) % N];
}

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultArea').innerHTML = '';

  const totalDelta = (5 + Math.random() * 5) * 2 * Math.PI + Math.random() * 2 * Math.PI;
  const duration   = 4000 + Math.random() * 1500;
  const start      = performance.now();
  const startAngle = currentAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    currentAngle = startAngle + totalDelta * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      currentSeg = getWinner(currentAngle);
      showWheelResult(currentSeg);
    }
  }
  requestAnimationFrame(frame);
}

// Click directly on a slice to select it (skips the spin animation)
canvas.addEventListener('click', (e) => {
  if (spinning) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width  / rect.width);
  const y = (e.clientY - rect.top)  * (canvas.height / rect.height);
  const dx = x - CX, dy = y - CY;
  const dist = Math.hypot(dx, dy);
  // Outside wheel rim or inside the central hub (where the spin button sits) → ignore
  if (dist > R || dist < 36) return;
  const clickAngle = Math.atan2(dy, dx);
  const normalized = (((clickAngle - currentAngle) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const idx = Math.floor(normalized / ARC) % N;
  currentSeg = segments[idx];
  showWheelResult(currentSeg);
});

function showWheelResult(seg) {
  document.getElementById('resultArea').innerHTML = `
    <div class="result-card ${seg.cls}">
      <div class="rc-top">
        <span class="result-emoji">${seg.emoji}</span>
        <span>${seg.label} !</span>
      </div>
      <button class="start-quiz-btn" onclick="startQuiz()">Jouer ce thème →</button>
    </div>`;
  launchConfetti(seg.color);
}

function launchConfetti(color) {
  const colors = [color, '#fff', '#FFE66D', '#4ECDC4', '#FF6B6B', '#C084FC', '#60AFFF'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    const s = (8 + Math.random() * 8) + 'px';
    el.style.width = el.style.height = s;
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ═══════════════════════════════════════════════
   QUIZ LOGIC
═══════════════════════════════════════════════ */
const MILESTONE = 10;                 // questions per milestone
let queue = [];                       // upcoming questions this run
let poolCache = [];                   // full pool, to reshuffle in endless mode
let currentQ = null;
let runScore = 0, runCount = 0;       // this run: correct answers / questions answered
let blockResults = [];                // correctness for the current block of 10
let answered = false;
let endless = true;                   // false during "revise mistakes" replay
let runTheme = null, runColor = '#FFE66D', runLabel = '';
let runLogged = false;

async function startQuiz() {
  if (!currentSeg) return;
  // DB first (Supabase), fall back to the static questions.js bank (offline-safe).
  let pool = [];
  if (window.QuizDB && window.QuizDB.fetchQuestions) {
    pool = await window.QuizDB.fetchQuestions(currentSeg.cls);
  }
  if (!pool || pool.length === 0) {
    pool = (window.QUIZ_DATA && window.QUIZ_DATA[currentSeg.cls]) || [];
  }
  if (!pool || pool.length === 0) {
    document.getElementById('resultArea').innerHTML =
      `<div class="result-card ${currentSeg.cls}"><div class="rc-top"><span>Aucune question pour ce thème 😅</span></div></div>`;
    return;
  }
  beginRun({ theme: currentSeg.cls, label: currentSeg.label, color: currentSeg.color,
             emoji: currentSeg.emoji, cls: currentSeg.cls, pool, endless: true });
}

// Start a run: an endless theme run, or a finite "revise mistakes" replay.
function beginRun({ theme, label, color, emoji, cls, pool, endless: isEndless }) {
  runTheme = theme; runColor = color; runLabel = label; endless = isEndless;
  poolCache = pool.slice();
  queue = shuffle(pool.slice());
  runScore = 0; runCount = 0; blockResults = []; runLogged = false;

  const badge = document.getElementById('catBadge');
  badge.textContent = `${emoji} ${label}`;
  badge.className = 'quiz-cat-badge ' + cls;
  badge.style.color = color;
  badge.style.borderColor = color;

  setBadgeScore();
  showScreen('quizScreen');
  currentQ = drawNext();
  renderQuestion();
}

function drawNext() {
  if (!queue.length) {
    if (endless) queue = shuffle(poolCache.slice());
    else return null;                 // finite run exhausted
  }
  return queue.shift();
}

// Live score shown under the player's name (top-right badge).
function setBadgeScore() {
  const el = document.querySelector('#currentPlayer .cp-score');
  if (el) el.textContent = runCount ? `⭐ ${runScore}/${runCount}` : '';
}

function renderQuestion() {
  answered = false;
  const q = currentQ;
  if (!q) { runComplete(); return; }
  const letters = ['A', 'B', 'C', 'D'];
  const posInBlock = runCount % MILESTONE;   // answered so far in the current block

  document.getElementById('questionNum').textContent = `Question ${runCount + 1}`;
  document.getElementById('questionText').textContent = q.question;

  // Question image (optional — illustration or image-as-question)
  const imgWrap = document.getElementById('questionImageWrap');
  if (q.image) {
    imgWrap.innerHTML = `<img src="${q.image}" alt="" onerror="this.parentElement.style.display='none'">`;
    imgWrap.style.display = '';
  } else {
    imgWrap.innerHTML = '';
    imgWrap.style.display = 'none';
  }

  // Progress dots — the current block of 10 (toward the next milestone)
  const dots = document.getElementById('progressDots');
  dots.innerHTML = '';
  for (let i = 0; i < MILESTONE; i++) {
    let cls = 'dot';
    if (i < blockResults.length) cls += blockResults[i] ? ' done' : ' wrong';
    else if (i === posInBlock) cls += ' current';
    const d = document.createElement('div');
    d.className = cls;
    dots.appendChild(d);
  }

  // Choices — image grid if optionImages set, otherwise text buttons
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  if (q.optionImages) {
    choicesEl.classList.add('grid');
    q.optionImages.forEach((src, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn img';
      btn.innerHTML =
        `<div class="img-wrap"><img src="${src}" alt="${q.options[i]}" onerror="this.style.display='none'"></div>` +
        `<span class="cap">${q.options[i]}</span>`;
      btn.onclick = () => selectAnswer(i);
      choicesEl.appendChild(btn);
    });
  } else {
    choicesEl.classList.remove('grid');
    q.options.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-letter">${letters[i]}</span>${c}`;
      btn.onclick = () => selectAnswer(i);
      choicesEl.appendChild(btn);
    });
  }

  // Reset feedback & next
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  const nb = document.getElementById('nextBtn');
  nb.className = 'next-btn';
  nb.textContent = ((runCount + 1) % MILESTONE === 0) ? 'Palier ! 🎉' : 'Question suivante →';

  // Animate card
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = '';
}

function selectAnswer(chosen) {
  if (answered) return;
  answered = true;
  const q = currentQ;
  const correctIdx = q.options.indexOf(q.answer);
  const btns = document.querySelectorAll('.choice-btn');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctIdx) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });

  const isCorrect = chosen === correctIdx;
  if (isCorrect) runScore++;
  runCount++;
  blockResults.push(isCorrect);

  // Record the attempt (fire-and-forget; never blocks the game)
  if (window.QuizDB && window.QuizDB.logAttempt) {
    window.QuizDB.logAttempt({
      profile_id: window.QuizDB.getProfileId(),
      question_id: q.db_id || null,
      theme: runTheme,
      difficulty: q.difficulty ?? null,
      is_correct: isCorrect
    });
  }
  setBadgeScore();

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? '✅ Bravo, c\'est la bonne réponse !' : `❌ La bonne réponse était : ${q.answer}`;

  // Update the dot we just answered
  const dots = document.getElementById('progressDots');
  const idx = (runCount - 1) % MILESTONE;
  if (dots.children[idx]) dots.children[idx].className = 'dot ' + (isCorrect ? 'done' : 'wrong');

  // Preload next question's image (if any) — silent on failure
  if (queue[0] && queue[0].image) new Image().src = queue[0].image;

  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion() {
  // Milestone every 10 answered questions.
  if (runCount > 0 && runCount % MILESTONE === 0) { showMilestone(); return; }
  currentQ = drawNext();
  if (!currentQ) { runComplete(); return; }
  renderQuestion();
}

function milestoneEmoji(s, total) {
  return s >= total * 0.8 ? '🏆' : s >= total * 0.5 ? '🎉' : '💪';
}

function showMilestone() {
  document.getElementById('msContinue').style.display = '';
  document.getElementById('msEmoji').textContent = milestoneEmoji(runScore, runCount);
  document.getElementById('msTitle').textContent = `Palier ${runCount / MILESTONE} atteint !`;
  document.getElementById('msNum').textContent = `${runScore} / ${runCount}`;
  document.getElementById('msNum').style.color = runColor;
  document.getElementById('msSub').textContent = 'bonnes réponses';
  showScreen('milestoneScreen');
  launchConfetti(runColor);
}

function continueRun() {
  blockResults = [];
  currentQ = drawNext();
  if (!currentQ) { runComplete(); return; }
  showScreen('quizScreen');
  renderQuestion();
}

// A finite run ("revise mistakes") has no more questions.
function runComplete() {
  finalizeRun();
  document.getElementById('msContinue').style.display = 'none';
  document.getElementById('msEmoji').textContent = '🎯';
  document.getElementById('msTitle').textContent = 'Révision terminée !';
  document.getElementById('msNum').textContent = `${runScore} / ${runCount}`;
  document.getElementById('msNum').style.color = runColor;
  document.getElementById('msSub').textContent = 'bonnes réponses';
  showScreen('milestoneScreen');
  launchConfetti(runColor);
}

// Log the run once (to sessions) when leaving it.
function finalizeRun() {
  if (runLogged) return;
  runLogged = true;
  const q = window.QuizDB;
  const pid = q && q.getProfileId && q.getProfileId();
  if (pid && runCount > 0 && q.logSession) {
    q.logSession({ profile_id: pid, theme: runTheme, score: runScore, total: runCount });
  }
}

/* ═══════════════════════════════════════════════
   PROGRESS PAGE  +  "revise mistakes" replay
═══════════════════════════════════════════════ */
let failedMap = {};

async function openProgress() {
  const q = window.QuizDB;
  const prof = q && q.getCurrentProfile && q.getCurrentProfile();
  if (!prof) { alert('Choisis un profil pour voir tes progrès. 🙂'); return; }
  showScreen('progressScreen');
  const body = document.getElementById('progressBody');
  body.innerHTML = '<div class="profile-loading">Chargement…</div>';
  const prog = await q.getProgress(prof.id);
  renderProgress(prog);
}

function renderProgress(prog) {
  failedMap = prog.failed || {};
  const body = document.getElementById('progressBody');
  const played = segments.filter(s => prog.byTheme[s.cls]);
  if (!played.length) {
    body.innerHTML = '<div class="profile-hint">Aucune partie jouée pour l\'instant. Va jouer ! 🎈</div>';
    return;
  }
  body.innerHTML = played.map(s => {
    const t = prog.byTheme[s.cls];
    const acc = t.answered ? Math.round(100 * t.correct / t.answered) : 0;
    const failed = t.failed || 0;
    return `<div class="prog-card" style="border-color:${s.color}">
      <div class="prog-head"><span class="prog-emoji">${s.emoji}</span><span class="prog-theme">${s.label}</span></div>
      <div class="prog-stats"><span><b>${t.answered}</b> répondues</span><span><b>${acc}%</b> réussies</span><span><b>${t.correct}</b> bonnes</span></div>
      ${failed
        ? `<button class="btn-primary prog-replay" onclick="startReplay('${s.cls}')">🔁 Réviser mes erreurs (${failed})</button>`
        : `<div class="prog-done">Aucune erreur à réviser 🎉</div>`}
    </div>`;
  }).join('');
}

async function startReplay(themeCls) {
  const ids = failedMap[themeCls] || [];
  if (!ids.length) return;
  const seg = segments.find(s => s.cls === themeCls);
  const q = window.QuizDB;
  let qs = [];
  if (q && q.fetchQuestionsByIds) qs = await q.fetchQuestionsByIds(ids);
  if (!qs.length) { alert('Impossible de charger les questions à réviser.'); return; }
  currentSeg = seg;   // keep segment context for colors/labels
  beginRun({ theme: themeCls, label: 'Révision · ' + seg.label, color: seg.color,
             emoji: seg.emoji, cls: seg.cls, pool: qs, endless: false });
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Current-player badge: shown while playing (wheel / quiz / milestone),
  // once a player (or guest) has been chosen so the name is populated.
  const cp = document.getElementById('currentPlayer');
  if (cp) {
    const onPlay = id === 'wheelScreen' || id === 'quizScreen' || id === 'milestoneScreen';
    const named = cp.querySelector('.cp-name').textContent;
    cp.style.display = (onPlay && named) ? 'flex' : 'none';
  }
}

function goToWheel() {
  finalizeRun();
  showScreen('wheelScreen');
}

// "Sans profil": delegate to the module if present, else a plain fallback.
function playGuest() {
  const q = window.QuizDB;
  if (q && q.playGuest) q.playGuest();
  else showScreen('wheelScreen');
}

/* ═══════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════ */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Init
drawWheel(0);

// If the Supabase module never loads (e.g. opened via file://), swap the
// loading placeholder for a plain "Jouer" fallback so the app stays usable.
setTimeout(() => {
  if (!window.QuizDB) {
    const list = document.getElementById('profileList');
    if (list) list.innerHTML =
      '<button class="profile-btn add" onclick="showScreen(\'wheelScreen\')"><span class="avatar">🎮</span><span>Jouer</span></button>';
  }
}, 1200);
</script>

<!-- Supabase: anonymous auth, profiles, progress helpers (ES module) -->
<script type="module">
import {
  ensureSession, getProfiles, createProfile, deleteProfile, AVATARS,
  logAttempt, logSession, fetchQuestions, getBestScores, getProgress, fetchQuestionsByIds
} from './assets/js/db.js';

const STORAGE_KEY = 'qr_profile_id';
let currentProfile = null;   // selected profile row, or null (guest)
let managing = false;
let pickedAvatar = AVATARS[0].emoji;

// Bits the classic game script calls (selectAnswer / startQuiz / showScreen / openProgress).
window.QuizDB = {
  logAttempt, logSession, fetchQuestions, getBestScores, getProgress, fetchQuestionsByIds,
  getProfileId: () => currentProfile ? currentProfile.id : null,
  getCurrentProfile: () => currentProfile,
  playGuest: () => play(null)
};

function ageFrom(birthdate) {
  if (!birthdate) return null;
  const b = new Date(birthdate), now = new Date();
  let a = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) a--;
  return (a >= 0 && a < 120) ? a : null;
}

function setCurrent(profile) {
  currentProfile = profile;
  if (profile) localStorage.setItem(STORAGE_KEY, profile.id);
  else localStorage.removeItem(STORAGE_KEY);
  const cp = document.getElementById('currentPlayer');
  if (cp) {
    cp.querySelector('.cp-avatar').textContent = profile ? (profile.avatar || '🙂') : '🎮';
    cp.querySelector('.cp-name').textContent = profile ? profile.first_name : 'Invité';
    cp.querySelector('.cp-score').textContent = '';
  }
}

function play(profile) {
  setCurrent(profile);
  window.showScreen('wheelScreen');
}

/* ── "Qui joue ?" picker ── */
async function renderProfiles() {
  const profiles = await getProfiles();
  const listEl = document.getElementById('profileList');
  const hintEl = document.getElementById('profileHint');
  const manageBtn = document.getElementById('manageBtn');
  listEl.innerHTML = '';

  // + Nouveau — always first.
  const add = document.createElement('button');
  add.className = 'profile-btn add';
  add.innerHTML = `<span class="avatar">➕</span><span>Nouveau</span>`;
  add.onclick = openCreate;
  listEl.appendChild(add);

  for (const p of profiles) {
    const age = ageFrom(p.birthdate);
    const btn = document.createElement('button');
    btn.className = 'profile-btn';
    btn.innerHTML =
      `<span class="avatar">${p.avatar || '🙂'}</span>` +
      `<span class="profile-name">${p.first_name}</span>` +
      (age != null ? `<span class="profile-age">${age} ans</span>` : '') +
      `<span class="profile-del" title="Supprimer">✕</span>`;
    btn.onclick = (e) => {
      if (e.target.classList.contains('profile-del')) return confirmDelete(p);
      if (managing) return;                 // in manage mode, taps don't start a game
      play(p);
    };
    listEl.appendChild(btn);
  }

  hintEl.textContent = profiles.length
    ? 'Touche ton personnage pour jouer.'
    : 'Crée ton premier joueur ! 🎉';
  manageBtn.style.display = profiles.length ? '' : 'none';
}

async function confirmDelete(p) {
  if (!confirm(`Supprimer le profil de ${p.first_name} ? Sa progression sera perdue.`)) return;
  const res = await deleteProfile(p.id);
  if (res.error) { alert(res.error); return; }
  if (currentProfile && currentProfile.id === p.id) setCurrent(null);
  await renderProfiles();
}

function initManage() {
  const btn = document.getElementById('manageBtn');
  btn.addEventListener('click', () => {
    managing = !managing;
    btn.setAttribute('aria-pressed', String(managing));
    btn.textContent = managing ? '✓ Terminé' : '🗑️ Gérer les profils';
    document.getElementById('profileScreen').classList.toggle('managing', managing);
  });
}

/* ── Create form ── */
function renderAvatarPicker() {
  const wrap = document.getElementById('avatarPick');
  wrap.innerHTML = '';
  AVATARS.forEach((a) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'avatar-opt' + (a.emoji === pickedAvatar ? ' sel' : '');
    b.textContent = a.emoji;
    b.title = a.label;
    b.onclick = () => {
      pickedAvatar = a.emoji;
      wrap.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
    wrap.appendChild(b);
  });
}

function openCreate() {
  document.getElementById('profileForm').reset();
  pickedAvatar = AVATARS[0].emoji;
  renderAvatarPicker();
  window.showScreen('profileCreateScreen');
}

function initCreateForm() {
  renderAvatarPicker();
  document.getElementById('pfCancel').addEventListener('click', () => window.showScreen('profileScreen'));
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const first_name = document.getElementById('pfFirst').value.trim();
    if (!first_name) return;
    const res = await createProfile({
      first_name,
      last_name: document.getElementById('pfLast').value.trim() || null,
      birthdate: document.getElementById('pfDob').value || null,
      avatar: pickedAvatar
    });
    if (res.error) { alert(res.error); return; }
    await renderProfiles();
    play(res.data);   // jump straight into playing as the new profile
  });
}

/* ── Startup ── */
(async () => {
  await ensureSession();
  initManage();
  initCreateForm();
  await renderProfiles();
})();
</script>
</body>
</html>
