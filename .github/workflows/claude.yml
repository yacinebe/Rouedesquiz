name: Claude Code

# Runs Claude when someone writes @claude in an issue, an issue comment,
# or a PR review comment. See CLAUDE.md for the backlog-item → PR workflow.
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these as a repo secret (Settings → Secrets and variables → Actions):
          #   CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` (uses your Claude subscription)
          #   ANTHROPIC_API_KEY       — from console.anthropic.com (pay per use)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Bash(node:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*)"'
