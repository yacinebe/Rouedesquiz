name: Claude Code

# Runs Claude when someone writes @claude in an issue, an issue comment,
# or a PR review comment. See CLAUDE.md for the backlog-item → PR workflow.
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these as a repo secret (Settings → Secrets and variables → Actions):
          #   CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` (uses your Claude subscription)
          #   ANTHROPIC_API_KEY       — from console.anthropic.com (pay per use)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Bash(node:*),Bash(git:*),Bash(gh:*)"'

      # The action itself only leaves a "Create PR" link, so open the PR here:
      # every branch Claude pushed for this issue that doesn't have one yet.
      # Runs even if Claude failed part-way — a pushed branch is still reviewable.
      - name: Open a PR for Claude's branch
        if: always() && github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          # The checkout is shallow and single-branch, so ask GitHub, not git.
          branch=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
                   --jq ".[].name | select(startswith(\"claude/issue-${ISSUE}-\"))" | tail -1)
          if [ -z "$branch" ]; then echo "No branch for issue #${ISSUE}; nothing to open."; exit 0; fi
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "PR already exists for $branch"; exit 0
          fi
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then echo "$branch has no new commits; nothing to open."; exit 0; fi

          # Rename to something readable: "F-44: Fix Arabic letter pronunciation"
          # becomes f-44-fix-arabic-letter-pronunciation. Same commits, new ref —
          # the claude/issue-N-… branch is deleted once the PR is open.
          slug=$(printf '%s' "$TITLE" \
                 | tr '[:upper:]' '[:lower:]' \
                 | sed -e 's/[^a-z0-9]\+/-/g' -e 's/^-//' -e 's/-$//' \
                 | cut -c1-60 | sed -e 's/-$//')
          [ -n "$slug" ] || slug="issue-${ISSUE}"
          named="$slug"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
               -f ref="refs/heads/${named}" -f sha="$sha" >/dev/null 2>&1; then
            echo "Opened PR from $named (was $branch)"
            old="$branch"; branch="$named"
          else
            echo "Could not create $named (name taken?) — keeping $branch"
            old=""
          fi

          gh pr create --base main --head "$branch" \
            --title "$TITLE" \
            --body "Automated PR for Claude's work on #${ISSUE}.

          See Claude's comment on #${ISSUE} for what changed, the decisions it made and what it verified.
          Test it on the Vercel preview linked below, then merge.

          Closes #${ISSUE}"

          # Drop the machine-named branch now that the PR lives on the named one.
          if [ -n "$old" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${old}" -X DELETE || true
          fi
