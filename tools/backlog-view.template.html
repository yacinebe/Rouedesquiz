<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizRoulette — Backlog</title>
<!-- GENERATED by tools/build-backlog-view.js from BACKLOG_FUNCTIONAL.md + BACKLOG_TECHNICAL.md — do not edit by hand. -->
<style>
  :root {
    --bg: #F7F4F2; --surface: #FFFFFF; --surface-2: #F1ECEA; --border: #E4DCD8; --border-strong: #D3C8C3;
    --ink: #241C2B; --muted: #7C7484; --faint: #A89FA6;
    --accent-fn: #E8464E; --accent-fn-soft: #FBE4E4; --accent-tc: #0E8E7C; --accent-tc-soft: #D8F0EB;
    --accent: var(--accent-fn); --accent-soft: var(--accent-fn-soft);

    --p-high-bg: #FCE3DE; --p-high-fg: #B23A2E;
    --p-med-bg: #FBEED2;  --p-med-fg: #9A6B18;
    --p-low-bg: #E5E9EE;  --p-low-fg: #5B6B7A;
    --s-todo-bg: #EDE9EC;  --s-todo-fg: #6C6472;
    --s-prog-bg: #DCEBF7;  --s-prog-fg: #26689B;
    --s-block-bg: #FADFD9; --s-block-fg: #B23A2E;
    --s-done-bg: #DAF0E3;  --s-done-fg: #2C7A4D;

    --shadow: 0 1px 2px rgba(36,28,43,.04), 0 8px 24px -12px rgba(36,28,43,.12);
    --sans: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    --maxw: 1220px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17131C; --surface: #211B28; --surface-2: #2A2331; --border: #342B3D; --border-strong: #43384E;
      --ink: #F2ECF2; --muted: #A79EAF; --faint: #79707F;
      --accent-fn: #FF6B71; --accent-fn-soft: #3A2226; --accent-tc: #3FD1B9; --accent-tc-soft: #12332F;
      --p-high-bg: #3E2420; --p-high-fg: #FF9A8E; --p-med-bg: #3A2E17; --p-med-fg: #E7B457; --p-low-bg: #232B33; --p-low-fg: #9DB2C4;
      --s-todo-bg: #2C2533; --s-todo-fg: #B6ADBE; --s-prog-bg: #14314A; --s-prog-fg: #82BEEC; --s-block-bg: #3E2420; --s-block-fg: #FF9A8E; --s-done-bg: #163326; --s-done-fg: #6FD69A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"] {
    --bg: #F7F4F2; --surface: #FFFFFF; --surface-2: #F1ECEA; --border: #E4DCD8; --border-strong: #D3C8C3;
    --ink: #241C2B; --muted: #7C7484; --faint: #A89FA6;
    --accent-fn: #E8464E; --accent-fn-soft: #FBE4E4; --accent-tc: #0E8E7C; --accent-tc-soft: #D8F0EB;
    --p-high-bg: #FCE3DE; --p-high-fg: #B23A2E; --p-med-bg: #FBEED2; --p-med-fg: #9A6B18; --p-low-bg: #E5E9EE; --p-low-fg: #5B6B7A;
    --s-todo-bg: #EDE9EC; --s-todo-fg: #6C6472; --s-prog-bg: #DCEBF7; --s-prog-fg: #26689B; --s-block-bg: #FADFD9; --s-block-fg: #B23A2E; --s-done-bg: #DAF0E3; --s-done-fg: #2C7A4D;
    --shadow: 0 1px 2px rgba(36,28,43,.04), 0 8px 24px -12px rgba(36,28,43,.12);
  }
  :root[data-theme="dark"] {
    --bg: #17131C; --surface: #211B28; --surface-2: #2A2331; --border: #342B3D; --border-strong: #43384E;
    --ink: #F2ECF2; --muted: #A79EAF; --faint: #79707F;
    --accent-fn: #FF6B71; --accent-fn-soft: #3A2226; --accent-tc: #3FD1B9; --accent-tc-soft: #12332F;
    --p-high-bg: #3E2420; --p-high-fg: #FF9A8E; --p-med-bg: #3A2E17; --p-med-fg: #E7B457; --p-low-bg: #232B33; --p-low-fg: #9DB2C4;
    --s-todo-bg: #2C2533; --s-todo-fg: #B6ADBE; --s-prog-bg: #14314A; --s-prog-fg: #82BEEC; --s-block-bg: #3E2420; --s-block-fg: #FF9A8E; --s-done-bg: #163326; --s-done-fg: #6FD69A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  /* track color scoping — used on rows, notes, dep chips, shipped groups */
  .trk-functional { --accent: var(--accent-fn); --accent-soft: var(--accent-fn-soft); }
  .trk-technical  { --accent: var(--accent-tc); --accent-soft: var(--accent-tc-soft); }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 40px) 72px; }

  /* header */
  header { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
  .wheel {
    width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto;
    background: conic-gradient(#E8464E 0 51deg, #F2A93B 0 103deg, #2CA36E 0 154deg, #2C7FB8 0 206deg, #7C57C4 0 257deg, #E85398 0 309deg, #E8464E 0 360deg);
    box-shadow: inset 0 0 0 4px var(--surface), var(--shadow); position: relative;
  }
  .wheel::after { content: ""; position: absolute; inset: 42% 42%; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--border-strong); }
  h1 { font-size: clamp(1.5rem, 3.4vw, 2.1rem); margin: 0; letter-spacing: -.02em; font-weight: 800; text-wrap: balance; }
  .sub { color: var(--muted); font-size: .95rem; margin: 2px 0 0; }
  .sub b { color: var(--ink); font-family: var(--mono); }
  .sub .fn { color: var(--accent-fn); font-weight: 700; }
  .sub .tc { color: var(--accent-tc); font-weight: 700; }
  .stamp { color: var(--faint); font-size: .74rem; margin: 4px 0 0; font-family: var(--mono); }

  /* strategic notes, side by side */
  .notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin: 24px 0 6px; }
  .note { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-left: 3px solid var(--accent); border-radius: 10px; padding: 13px 16px; font-size: .86rem; }
  .note .tag { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--accent); display: block; margin-bottom: 3px; }
  .note b, .note strong { color: var(--accent); }
  .note code { font-family: var(--mono); font-size: .82em; background: color-mix(in srgb, var(--surface) 60%, transparent); padding: 1px 5px; border-radius: 4px; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .tile .n { font-size: 1.55rem; font-weight: 800; font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile .l { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }
  .tile.fn { border-color: color-mix(in srgb, var(--accent-fn) 35%, var(--border)); }
  .tile.fn .n { color: var(--accent-fn); }
  .tile.tc { border-color: color-mix(in srgb, var(--accent-tc) 35%, var(--border)); }
  .tile.tc .n { color: var(--accent-tc); }

  /* sticky toolbar */
  .toolbar {
    position: sticky; top: 0; z-index: 5; margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
    padding: 12px 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .fgroup { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fgroup .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); }
  .fgroup button { font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; transition: all .15s; display: inline-flex; align-items: center; gap: 7px; }
  .fgroup button:hover { border-color: var(--border-strong); color: var(--ink); }
  .fgroup button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .fgroup button .dot { width: 8px; height: 8px; border-radius: 50%; }
  .fgroup button[data-track="functional"] .dot { background: var(--accent-fn); }
  .fgroup button[data-track="technical"] .dot { background: var(--accent-tc); }
  .showing { margin-left: auto; font-size: .82rem; color: var(--muted); font-family: var(--mono); }
  .showing b { color: var(--ink); }

  /* table */
  .tablecard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .scroller { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 860px; }
  thead th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; padding: 13px 14px; border-bottom: 1px solid var(--border-strong); background: var(--surface-2); white-space: nowrap; }
  thead th.center, tbody td.center { text-align: center; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: .92rem; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
  td.seq { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--faint); font-size: .8rem; text-align: right; width: 34px; }
  td.id { font-family: var(--mono); font-weight: 700; color: var(--accent); white-space: nowrap; font-size: .86rem; border-left: 3px solid var(--accent); }
  td.item .t { font-weight: 700; }
  td.item .d { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  td.item .d em { font-style: normal; color: var(--faint); }
  td.item code { font-family: var(--mono); font-size: .82em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  .chip { display: inline-block; font-family: var(--mono); font-size: .72rem; font-weight: 700; letter-spacing: .02em; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
  .size { min-width: 34px; text-align: center; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--ink); }
  .size.xl { color: var(--accent); border-color: var(--accent); }
  .pri.High { background: var(--p-high-bg); color: var(--p-high-fg); }
  .pri.Med  { background: var(--p-med-bg);  color: var(--p-med-fg); }
  .pri.Low  { background: var(--p-low-bg);  color: var(--p-low-fg); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 650; padding: 3px 10px 3px 8px; border-radius: 20px; white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .9; }
  .st.Todo { background: var(--s-todo-bg); color: var(--s-todo-fg); }
  .st.Inprogress { background: var(--s-prog-bg); color: var(--s-prog-fg); }
  .st.Blocked { background: var(--s-block-bg); color: var(--s-block-fg); }
  .st.Done { background: var(--s-done-bg); color: var(--s-done-fg); }
  .deps { display: flex; flex-wrap: wrap; gap: 4px; }
  .dep { font-family: var(--mono); font-size: .72rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
  .dep.trk { color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .dep.ext { color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
  .dep.none { color: var(--faint); }
  .dep.cycle { border-style: dashed !important; border-color: var(--p-high-fg) !important; color: var(--p-high-fg); background: transparent; }
  .empty td { padding: 24px 16px; color: var(--muted); font-size: .9rem; font-style: italic; text-align: center; }

  /* legend */
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 16px 2px 0; font-size: .8rem; color: var(--muted); }
  .legend .grp { display: flex; align-items: center; gap: 8px; }
  .legend .grp strong { color: var(--ink); font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
  .legend .swatch { display: inline-flex; align-items: center; gap: 5px; }
  .legend .sq { width: 11px; height: 11px; border-radius: 3px; }

  /* shipped */
  details.shipped { margin-top: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px 18px; }
  details.shipped summary { cursor: pointer; font-weight: 700; padding: 12px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.shipped summary::-webkit-details-marker { display: none; }
  details.shipped summary .caret { transition: transform .2s; color: var(--muted); }
  details.shipped[open] summary .caret { transform: rotate(90deg); }
  .ship-group { margin: 4px 0 14px; }
  .ship-group h3 { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin: 8px 0 8px; }
  .ship-group ul { margin: 0; padding-left: 4px; list-style: none; display: grid; gap: 7px; }
  .ship-group li { color: var(--muted); font-size: .89rem; padding-left: 22px; position: relative; }
  .ship-group li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 800; }

  @media (max-width: 680px) { td.item .d { display: none; } .showing { margin-left: 0; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="wheel" aria-hidden="true"></div>
    <div>
      <h1>QuizRoulette — Product Backlog</h1>
      <p class="sub" id="overview"></p>
      <p class="stamp" id="stamp"></p>
    </div>
  </header>

  <div class="notes" id="notes"></div>
  <div class="tiles" id="tiles"></div>

  <div class="toolbar">
    <div class="fgroup" id="f-track">
      <span class="lbl">Track</span>
      <button data-track="all" aria-pressed="true">All</button>
      <button data-track="functional" aria-pressed="false"><span class="dot"></span>Functional</button>
      <button data-track="technical" aria-pressed="false"><span class="dot"></span>Technical</button>
    </div>
    <div class="fgroup" id="f-pri">
      <span class="lbl">Priority</span>
      <button data-pri="all" aria-pressed="true">All</button>
      <button data-pri="High" aria-pressed="false">High</button>
      <button data-pri="Med" aria-pressed="false">Med</button>
      <button data-pri="Low" aria-pressed="false">Low</button>
    </div>
    <span class="showing" id="showing"></span>
  </div>

  <div class="tablecard"><div class="scroller"><table>
    <thead><tr>
      <th class="center" title="Suggested order — prerequisites first, then priority">#</th>
      <th>ID</th>
      <th>Item — what &amp; why</th>
      <th class="center">Size</th>
      <th class="center">Priority</th>
      <th>Depends on</th>
      <th>Status</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div></div>

  <div class="legend">
    <div class="grp"><strong>Track</strong>
      <span class="swatch"><span class="sq" style="background:var(--accent-fn)"></span>Functional</span>
      <span class="swatch"><span class="sq" style="background:var(--accent-tc)"></span>Technical</span></div>
    <div class="grp"><strong>Size</strong> <span class="chip size">S</span>&lt;2h · <span class="chip size">M</span>½-day · <span class="chip size">L</span>multi-day · <span class="chip size">XL</span>split first</div>
    <div class="grp"><strong>Priority</strong> <span class="chip pri High">High</span> <span class="chip pri Med">Med</span> <span class="chip pri Low">Low</span></div>
    <div class="grp"><strong>Status</strong> <span class="st Todo">Todo</span> <span class="st Inprogress">In progress</span> <span class="st Blocked">Blocked</span> <span class="st Done">Done</span></div>
  </div>

  <details class="shipped">
    <summary><span class="caret">▸</span> <span id="ship-title">Shipped</span></summary>
    <div id="shipped-body"></div>
  </details>
</div>

<script>
const DATA = /*__DATA__*/ {};
const ITEMS = DATA.items || [];
const IDSET = new Set(ITEMS.map(i => i.id));
const SEQ = new Map(ITEMS.map(i => [i.id, i.seq]));
let fTrack = 'all', fPri = 'all';

function statusClass(s) { return s.replace(/\s+/g, ''); }
function depChip(d, selfSeq) {
  const trk = d.startsWith('F-') ? 'trk trk-functional' : d.startsWith('T-') ? 'trk trk-technical' : 'ext';
  const cyc = (IDSET.has(d) && SEQ.get(d) > selfSeq) ? ' cycle' : '';
  const title = cyc ? ' title="↻ ordered later — circular dependency"' : '';
  return `<span class="dep ${trk}${cyc}"${title}>${cyc ? '↻ ' : ''}${d}</span>`;
}
function rowHtml(it) {
  const deps = it.deps.length ? `<div class="deps">${it.deps.map(d => depChip(d, it.seq)).join('')}</div>` : `<span class="dep none">—</span>`;
  return `<tr class="trk-${it.track}">
    <td class="seq">${it.seq}</td>
    <td class="id">${it.id}</td>
    <td class="item"><div class="t">${it.title}</div><div class="d">${it.desc}</div></td>
    <td class="center"><span class="chip size ${it.size==='XL'?'xl':''}">${it.size}</span></td>
    <td class="center"><span class="chip pri ${it.priority}">${it.priority}</span></td>
    <td>${deps}</td>
    <td><span class="st ${statusClass(it.status)}">${it.status}</span></td>
  </tr>`;
}

function renderRows() {
  const items = ITEMS.filter(i => (fTrack === 'all' || i.track === fTrack) && (fPri === 'all' || i.priority === fPri));
  const tb = document.getElementById('rows');
  tb.innerHTML = items.length ? items.map(rowHtml).join('') : `<tr class="empty"><td colspan="7">No items match this filter.</td></tr>`;
  const bits = [];
  if (fTrack !== 'all') bits.push(fTrack);
  if (fPri !== 'all') bits.push(fPri + ' priority');
  document.getElementById('showing').innerHTML = `<b>${items.length}</b> of ${ITEMS.length}` + (bits.length ? ' · ' + bits.join(' · ') : '');
}

function renderTiles() {
  const fn = ITEMS.filter(i => i.track === 'functional').length;
  const tc = ITEMS.filter(i => i.track === 'technical').length;
  const by = p => ITEMS.filter(i => i.priority === p).length;
  const ready = ITEMS.filter(i => !i.deps.some(d => IDSET.has(d))).length;
  const shipped = (DATA.shipped.functional.length + DATA.shipped.technical.length);
  const tiles = [
    ['fn', fn, 'Functional'], ['tc', tc, 'Technical'],
    ['', by('High'), 'High'], ['', by('Med'), 'Med'], ['', by('Low'), 'Low'],
    ['', ready, 'No blockers'], ['', shipped, 'Shipped'],
  ];
  document.getElementById('tiles').innerHTML = tiles.map(([c,n,l]) => `<div class="tile ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function renderNotes() {
  const order = [['functional','Functional'], ['technical','Technical']];
  document.getElementById('notes').innerHTML = order.map(([k,label]) =>
    DATA.notes[k] ? `<div class="note trk-${k}"><span class="tag">${label}</span>${DATA.notes[k]}</div>` : '').join('');
}

function renderShipped() {
  const groups = [['functional','Functional'], ['technical','Technical']];
  const total = DATA.shipped.functional.length + DATA.shipped.technical.length;
  document.getElementById('ship-title').textContent = `Shipped (${total})`;
  document.getElementById('shipped-body').innerHTML = groups.map(([k,label]) =>
    `<div class="ship-group trk-${k}"><h3>${label}</h3><ul>${DATA.shipped[k].map(s => `<li>${s}</li>`).join('')}</ul></div>`).join('');
}

document.querySelectorAll('#f-track button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#f-track button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true'); fTrack = b.dataset.track; renderRows();
}));
document.querySelectorAll('#f-pri button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#f-pri button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true'); fPri = b.dataset.pri; renderRows();
}));

const fnN = ITEMS.filter(i => i.track === 'functional').length;
const tcN = ITEMS.filter(i => i.track === 'technical').length;
document.getElementById('overview').innerHTML =
  `<b>${ITEMS.length}</b> open items, one ordered plan · <span class="fn">${fnN} functional</span> · <span class="tc">${tcN} technical</span>`;
document.getElementById('stamp').textContent = DATA.generatedAt ? ('Sorted: dependencies first, then priority · generated ' + DATA.generatedAt) : '';

renderNotes(); renderTiles(); renderRows(); renderShipped();
</script>

</body>
</html>
